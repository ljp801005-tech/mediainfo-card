<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MediaInfo 卡片</title>
<style>
  :root {
    --fg: #1c1e21;
    --dim: #6b7280;
    --line: rgba(0, 0, 0, .1);
    --bg: #fff;
    --btn: #f1f3f5;
    --btn-hover: #e6e9ed;
    --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6e8eb;
      --dim: #9aa1a9;
      --line: rgba(255, 255, 255, .12);
      --bg: #1b1d21;
      --btn: #25282d;
      --btn-hover: #2e3238;
      --accent: #6c8cff;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 268px;
    margin: 0;
    padding: 12px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .hd { display: flex; align-items: baseline; gap: 6px; margin-bottom: 2px; }
  .hd b { font-size: 13.5px; font-weight: 600; letter-spacing: .01em; }
  .hd span { margin-left: auto; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .sub { color: var(--dim); font-size: 11.5px; margin-bottom: 10px; word-break: break-all; }
  .list { display: flex; flex-direction: column; gap: 4px; }
  button {
    appearance: none;
    width: 100%;
    text-align: left;
    padding: 7px 9px;
    border: 0;
    border-radius: 7px;
    background: var(--btn);
    color: var(--fg);
    font: inherit;
    cursor: pointer;
    transition: background .12s ease;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: translateY(.5px); }
  .empty {
    padding: 10px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--dim);
    font-size: 12px;
  }
  .foot {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
    display: flex;
    gap: 6px;
  }
  .foot a { color: var(--accent); text-decoration: none; margin-left: auto; }
  .foot a:hover { text-decoration: underline; }
  kbd {
    font: inherit;
    padding: 0 4px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="hd">
    <b>MediaInfo 卡片</b>
    <span id="ver"></span>
  </div>
  <div class="sub" id="host">正在读取当前页面…</div>
  <div class="list" id="list"></div>
  <div class="foot">
    <span>快捷键 <kbd>Alt</kbd>+<kbd>M</kbd></span>
    <a href="https://github.com/ljp801005-tech/mediainfo-card" target="_blank" rel="noopener noreferrer">仓库</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
